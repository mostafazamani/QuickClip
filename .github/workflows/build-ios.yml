name: Build iOS (unsigned IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build QuickClip
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build archive (unsigned)
        run: |
          xcodebuild \
            -project QuickClip.xcodeproj \
            -scheme QuickClip \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/QuickClip.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/QuickClip.xcarchive/Products/Applications/QuickClip.app" build/Payload/
          cd build
          zip -qry QuickClip-unsigned.ipa Payload

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickClip-unsigned-ipa
          path: build/QuickClip-unsigned.ipa

      - name: Attach IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: QuickClip build ${{ github.run_number }}
          files: build/QuickClip-unsigned.ipa
          body: |
            Unsigned IPA built automatically by GitHub Actions.
            Install it with **AltStore** or **Sideloadly** using your free Apple ID
            (valid for 7 days, re-sign to renew).
